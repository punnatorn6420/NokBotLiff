<!-- src/app/alert-error/alert-error.component.html -->
<div class="error-container">
  <div class="error-content">
    <!-- Icon -->
    <div class="error-icon">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#FFD700"/>
      </svg>
    </div>

    <!-- Error Title -->
    <h1 class="error-title">500</h1>
    <h2 class="error-subtitle">เกิดข้อผิดพลาดของเซิร์ฟเวอร์</h2>

    <!-- Error Message -->
    <p class="error-message">
      ขออภัย เกิดข้อผิดพลาดในระบบ<br>
      กรุณาลองใหม่อีกครั้งในภายหลัง
    </p>

    <!-- Action Buttons -->
    <div class="error-actions">
      <button class="btn-retry" (click)="retry()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
        </svg>
        ลองใหม่
      </button>
      
      <button class="btn-back" (click)="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/>
        </svg>
        กลับไปหน้าเดิม
      </button>
    </div>
  </div>
</div>
